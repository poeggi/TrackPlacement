name: CI/CD - TrackPlacement Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version Number (e.g., 1.21.0)'
        required: false
      changelog_override:
        description: 'Manual Changelog (Optional)'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Create the distribution files
      - name: Create Release Archives
        run: |
          zip -r TrackPlacement.mcpack . -x "*.git*" ".github/*" "README.md" ".gitignore"
          cp TrackPlacement.mcpack TrackPlacement.zip

      # Step 2: Upload to Modrinth
      - name: Upload to Modrinth
        if: github.event.inputs.version_override != '' || github.event.release.tag_name != ''
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: lDi9Keu1
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          
          files: TrackPlacement.zip
          version: ${{ github.event.inputs.version_override || github.event.release.tag_name }}
          version-type: release
          changelog: ${{ github.event.inputs.changelog_override || github.event.release.body }}
          
          loaders: bedrock
          game-versions: |
            1.21
            26.0
            26.3

      # Step 3: Upload to CurseForge
      - name: Upload to CurseForge
        if: github.event.inputs.version_override != '' || github.event.release.tag_name != ''
        continue-on-error: true
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: "1483473"
          game_endpoint: "minecraft-bedrock"
          file_path: "TrackPlacement.mcpack"
          display_name: "TrackPlacement ${{ github.event.inputs.version_override || github.event.release.tag_name }}"
          release_type: "release"
          game_versions: "1.21,26.0,26.3"
